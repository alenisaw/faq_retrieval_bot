# Запуск всего проекта:  docker compose up --build
#   API:      http://localhost:8000/docs
#   фронтенд: docker compose --profile frontend up --build  ->  http://localhost:3000
# Сброс данных (журнал бота, прогоны) к версии из репозитория: docker compose down -v
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      API_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      API_WARMUP_METHODS: ""            # например "e5_small" — построить при старте
    volumes:
      - processed:/srv/backend/data/processed   # faq.db: журнал бота и прогоны переживают перезапуск
      - models:/srv/backend/models              # chatbot.json, классификатор тем
      - hf-cache:/srv/.cache/huggingface        # модели e5/MiniLM скачиваются один раз
      - ./reports:/srv/reports                  # графики и метрики видны на хосте
    restart: unless-stopped

  # Включается флагом --profile frontend, когда в репозитории появится frontend/ с Dockerfile
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  processed:
  models:
  hf-cache:
